name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: ./macos/build.sh

      - name: Package zip
        run: |
          set -euo pipefail
          cd dist
          ditto -c -k --keepParent "Cursor 数据库清理.app" "Cursor-DB-Cleaner-macos.zip"
          shasum -a 256 "Cursor-DB-Cleaner-macos.zip" | tee Cursor-DB-Cleaner-macos.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cursor-DB-Cleaner-macos
          path: |
            dist/Cursor-DB-Cleaner-macos.zip
            dist/Cursor-DB-Cleaner-macos.sha256
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Cursor-DB-Cleaner-macos.zip
            dist/Cursor-DB-Cleaner-macos.sha256
          generate_release_notes: true
